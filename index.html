<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <!-- Badge (Position Absolute) -->
    <div class="badge">✔</div>

    <!-- Profile Image -->
    <div class="card-header">
      <img src="assets/profile.jpg" alt="Profile Image">
    </div>

    <!-- Content -->
    <div class="card-body">
      <h2>Gourav Sharma</h2>
      <h4>Web Developer</h4>
      <p>Passionate about building modern web applications and UI designs.</p>
    </div>

    <!-- Stats -->
    <div class="card-stats">
      <div>
        <h3>1.2K</h3>
        <p>Followers</p>
      </div>
      <div>
        <h3>300</h3>
        <p>Likes</p>
      </div>
      <div>
        <h3>50</h3>
        <p>Projects</p>
      </div>
    </div>

    <!-- Button -->
    <div class="card-footer">
      <button>Follow</button>
    </div>

  </div>

</body>
</html>
